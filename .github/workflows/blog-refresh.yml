name: 공쌤 블로그 30분 자동 갱신
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kongmath-blog-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 워드프레스 표준 예약 작업 실행
        id: blog_cron
        run: |
          curl --fail --silent --show-error --max-time 210 'https://kongmath.mycafe24.com/wp-cron.php?doing_wp_cron' -o /tmp/kongmath-cron.txt
          python3 - <<'PY'
          from pathlib import Path
          body = Path('/tmp/kongmath-cron.txt').read_text().strip()
          assert not body, '워드프레스 예약 실행 오류 응답'
          print('워드프레스 예약 작업 호출 완료')
          PY
      - name: 7일마다 자동 갱신 유지 기록
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CRON_OUTCOME: ${{ steps.blog_cron.outcome }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          from datetime import datetime, timedelta, timezone
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          def due(previous, now):
              if previous is None:
                  return True
              stamp = datetime.fromisoformat(previous['lastMaintenanceAt'].replace('Z', '+00:00'))
              if stamp.tzinfo is None or stamp > now + timedelta(days=1):
                  raise ValueError('유지 기록 날짜 확인 필요')
              return now - stamp >= timedelta(days=7)

          now = datetime.now(timezone.utc)
          assert due(None, now)
          assert not due({'lastMaintenanceAt': (now - timedelta(days=6)).isoformat()}, now)
          assert due({'lastMaintenanceAt': (now - timedelta(days=8)).isoformat()}, now)
          try:
              due({'lastMaintenanceAt': 'invalid'}, now)
          except ValueError:
              pass
          else:
              raise AssertionError('잘못된 날짜 차단 실패')

          api = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/contents/.github/blog-automation-status.json'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          previous = None
          sha = None
          try:
              with urlopen(Request(api + '?ref=main', headers=headers), timeout=30) as response:
                  stored = json.load(response)
              previous = json.loads(base64.b64decode(stored['content']))
              if previous.get('version') != 1:
                  raise ValueError('알 수 없는 유지 기록은 덮어쓰지 않습니다')
              sha = stored['sha']
          except HTTPError as error:
              if error.code != 404:
                  raise

          if due(previous, now):
              record = {'version': 1, 'lastMaintenanceAt': now.isoformat(), 'refreshIntervalSeconds': 1800, 'maintenanceIntervalDays': 7, 'cronOutcome': os.environ['CRON_OUTCOME']}
              encoded = base64.b64encode((json.dumps(record, ensure_ascii=False, indent=2) + '\n').encode()).decode()
              payload = {'message': 'Maintain scheduled blog automation activity', 'content': encoded, 'branch': 'main'}
              if sha:
                  payload['sha'] = sha
              request = Request(api, data=json.dumps(payload).encode(), headers=headers, method='PUT')
              with urlopen(request, timeout=30) as response:
                  result = json.load(response)
              print('주간 유지 기록 생성 완료:', result['commit']['sha'])
          else:
              print('최근 7일 내 유지 기록이 있어 추가 기록 없이 유지합니다')
          PY
