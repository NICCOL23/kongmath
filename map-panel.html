<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>공쌤수학원 위치 지도</title><style>html,body,#map{margin:0;width:100%;height:100%;overflow:hidden}body{background:#f2f6fa;font-family:system-ui,sans-serif}#status{position:absolute;left:16px;right:16px;top:16px;color:#52647a;font-size:14px;line-height:1.5}#status[hidden]{display:none}</style></head><body><div id="map" role="region" aria-label="공쌤수학원 위치 지도"></div><p id="status">공쌤수학원 위치 지도를 불러오는 중입니다.</p><script>
(()=>{'use strict';const status=document.querySelector('#status');let map,ready=false;const allowed=['https://kongmath.com','https://www.kongmath.com','https://kongmath.mycafe24.com'];let parentOrigin='';try{const u=new URL(document.referrer);if(allowed.includes(u.origin))parentOrigin=u.origin;}catch{}function notify(type){if(parentOrigin&&window.parent!==window)window.parent.postMessage({type},parentOrigin);}function fail(){if(ready)return;status.hidden=false;status.textContent='지도를 불러오지 못했습니다. 팝업의 주소와 네이버 길찾기 버튼을 이용해 주세요.';notify('km-map-error');}document.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();notify('km-map-close');}});window.navermap_authFailure=fail;const sdk=document.createElement('script');sdk.src='https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=6zu5drbrbg';sdk.addEventListener('error',fail);sdk.addEventListener('load',()=>{if(!window.naver?.maps?.Map)return fail();try{const maps=window.naver.maps,position=new maps.LatLng(35.1589987,129.0507152);map=new maps.Map(document.querySelector('#map'),{center:position,zoom:17,zoomControl:true,scrollWheel:false});new maps.Marker({map,position,title:'공쌤수학원'});maps.Event.addListener(map,'tilesloaded',()=>{ready=true;status.hidden=true;notify('km-map-ready');});window.addEventListener('resize',()=>{if(map){map.setSize(new maps.Size(innerWidth,innerHeight));map.setCenter(position);}});}catch{fail();}});document.head.append(sdk);setTimeout(()=>{if(!ready)fail();},10000);})();
</script></body></html>
